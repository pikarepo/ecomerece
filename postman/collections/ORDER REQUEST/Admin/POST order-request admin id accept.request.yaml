$kind: http-request
id: cb21d5d23ba5c6e12eb6a295
name: POST /order-request/admin/{{orderRequestId}}/accept
description: admin route
method: POST
url: '{{baseUrl}}/order-request/admin/{{orderRequestId}}/accept'
body:
  type: json
  content: |-
    {
      "note": "Note example"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /order-request/admin/:id/accept returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 8000
