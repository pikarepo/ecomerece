$kind: http-request
id: eab2157faac2fdd544afc155
name: PATCH /order-request/my/{{orderRequestId}}/cancel
description: buyer route
method: PATCH
url: '{{baseUrl}}/order-request/my/{{orderRequestId}}/cancel'
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /order-request/my/:id/cancel returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 2000
