$kind: http-request
id: e6f15g4b7d2a0c358f9a14de
name: POST /order-request/vendor/{{orderRequestId}}/accept
description: vendor route — accept a buyer's order request
method: POST
url: '{{baseUrl}}/order-request/vendor/{{orderRequestId}}/accept'
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /order-request/vendor/:id/accept returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 4000
