$kind: http-request
url: '{{baseUrl}}/home/admin/promos'
method: POST
body:
  type: json
  content: |-
    {
        "title": "This is title of promo 4",
        "subtitle":  "This is title of sub-promo 4",
        "image": "https://example.com/client/home",
        "accent": "#FB923C",
        "link": "https://example.com/client/home"
    }
settings: {}
order: 4000
scripts:
  - type: afterResponse
    code: |-
      pm.test('request succeeds', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.below(400);
      });
    language: text/javascript
