$kind: http-request
id: 033aedce310ca25d2e999b62
name: POST /home/admin/slides
description: admin route
method: POST
url: '{{baseUrl}}/home/admin/slides'
body:
  type: json
  content: |-
    {
      "tag": "Tag example",
      "title": "Title example",
      "subhead": "Subhead example",
      "subtitle": "Subtitle example",
      "cta": "Cta example",
      "image": "Image example",
      "accent": "Accent example",
      "displayOrder": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /home/admin/slides returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
