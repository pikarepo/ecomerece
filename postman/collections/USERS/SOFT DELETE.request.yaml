$kind: http-request
id: r5l04t3o6q1n9p257s8n03qr
name: DELETE /users/admin/soft
description: admin route — soft-delete a user account (recoverable)
method: DELETE
url: '{{baseUrl}}/users/admin/soft'
body:
  type: json
  content: |-
    {
      "userId": "{{userId}}",
      "reason": "Account removed per user request."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('DELETE /users/admin/soft returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 13000
