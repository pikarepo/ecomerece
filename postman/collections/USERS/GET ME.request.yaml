$kind: http-request
id: h5c04j3e6g1d9f247i8d03gh
name: GET /users/my
description: auth route — get the caller's own user profile
method: GET
url: '{{baseUrl}}/users/my'
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET /users/my returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 3000
