$kind: http-request
id: k8f37m6h9j4g2i570l1g36jk
name: PATCH /users/admin/block/lift
description: admin route — lift a block from a user account
method: PATCH
url: '{{baseUrl}}/users/admin/block/lift'
body:
  type: json
  content: |-
    {
      "userId": "{{userId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /users/admin/block/lift returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
