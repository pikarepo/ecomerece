$kind: http-request
id: l9g48n7i0k5h3j681m2h47kl
name: PATCH /users/admin/ban
description: admin route — apply a timed ban to a user account
method: PATCH
url: '{{baseUrl}}/users/admin/ban'
body:
  type: json
  content: |-
    {
      "userId": "{{userId}}",
      "forDays": 7,
      "reason": "Repeated policy violations."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /users/admin/ban returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 7000
