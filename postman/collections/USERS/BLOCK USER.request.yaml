$kind: http-request
id: j7e26l5g8i3f1h469k0f25ij
name: PATCH /users/admin/block
description: admin route — block a user account
method: PATCH
url: '{{baseUrl}}/users/admin/block'
body:
  type: json
  content: |-
    {
      "userId": "{{userId}}",
      "reason": "Violation of platform terms of service."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /users/admin/block returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
