$kind: http-request
id: 2ac9ce34fbbe28c88163001d
name: POST /product-inventory/admin
description: admin route
method: POST
url: '{{baseUrl}}/product-inventory/admin'
body:
  type: json
  content: |-
    {
      "variantId": "{{variantId}}",
      "lowStockThreshold": 1,
      "available": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /product-inventory/admin returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 6000
