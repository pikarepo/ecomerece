$kind: http-request
id: 7e4802f097f503789d6a98ec
name: PATCH /product-inventory/admin/{{inventoryId}}/threshold
description: admin route
method: PATCH
url: '{{baseUrl}}/product-inventory/admin/{{inventoryId}}/threshold'
body:
  type: json
  content: |-
    {
      "lowStockThreshold": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /product-inventory/admin/:id/threshold returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
