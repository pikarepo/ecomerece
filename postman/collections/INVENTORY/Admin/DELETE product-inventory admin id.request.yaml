scripts:
  - type: afterResponse
    code: |-
      pm.test('DELETE /product-inventory/admin/:id returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
