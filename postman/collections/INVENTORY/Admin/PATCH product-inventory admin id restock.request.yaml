id: e6c5adaf66ee417b5a1ce839
name: PATCH /product-inventory/admin/{{inventoryId}}/restock
description: admin route
method: PATCH
url: '{{baseUrl}}/product-inventory/admin/{{inventoryId}}/restock'
body:
  type: json
  content: |-
    {
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /product-inventory/admin/:id/restock returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
