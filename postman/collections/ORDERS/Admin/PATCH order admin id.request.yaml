$kind: http-request
id: 61ce93dfc872b18920928f1a
name: PATCH /order/admin/{{orderId}}
description: admin route
method: PATCH
url: '{{baseUrl}}/order/admin/{{orderId}}'
body:
  type: json
  content: |-
    {
      "totalPrice": 1,
      "address": "Address example"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /order/admin/:id returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 8000
