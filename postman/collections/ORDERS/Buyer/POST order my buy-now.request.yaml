$kind: http-request
id: 442877bf579561b3575649b6
name: POST /order/my/buy-now
description: buyer route
method: POST
url: '{{baseUrl}}/order/my/buy-now'
body:
  type: json
  content: |-
    {
      "idempotentKey": "{{idempotentKey}}",
      "addressId": "{{addressId}}",
      "variantId": "{{variantId}}",
      "quantity": 1,
      "waitingTime": {}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /order/my/buy-now returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 2000
