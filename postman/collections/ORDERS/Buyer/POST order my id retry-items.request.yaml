$kind: http-request
id: u2p71w0r3t8q6s914v5q70tu
name: POST /order/my/{{orderId}}/retry-items
description: buyer route — retry all failed items in an order
method: POST
url: '{{baseUrl}}/order/my/{{orderId}}/retry-items'
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /order/my/:id/retry-items returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 5000
