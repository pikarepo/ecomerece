$kind: http-request
id: t1o60v9q2s7p5r803u4p69st
name: POST /order/my
description: buyer route — create a new order from cart items
method: POST
url: '{{baseUrl}}/order/my'
body:
  type: json
  content: |-
    {
      "addressId": "{{addressId}}",
      "idempotentKey": "{{idempotentKey}}",
      "waitingTime": "2027-01-01T00:00:00.000Z",
      "safeOrder": false,
      "items": [
        {
          "variantId": "{{variantId}}",
          "quantity": 2
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /order/my returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 1000
