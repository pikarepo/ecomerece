$kind: http-request
id: i0d59k8f1h6e4g792j3e58hi
name: POST /order/admin/{{orderId}}/cancel
description: admin route — cancel an order on behalf of a buyer
method: POST
url: '{{baseUrl}}/order/admin/{{orderId}}/cancel'
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /order/admin/:id/cancel returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 4000
