$kind: http-request
id: p7k26r5m8o3l1n469q0l25op
name: POST /order/vendor/{{orderId}}/confirm
description: vendor route — confirm that the order is being prepared
method: POST
url: '{{baseUrl}}/order/vendor/{{orderId}}/confirm'
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /order/vendor/:id/confirm returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 2000
