$kind: http-request
id: r9m48t7o0q5n3p681s2n47qr
name: POST /order/vendor/{{orderId}}/return
description: vendor route — mark the order as returned
method: POST
url: '{{baseUrl}}/order/vendor/{{orderId}}/return'
body:
  type: json
  content: |-
    {
      "reason": "Customer returned the product."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /order/vendor/:id/return returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 4000
