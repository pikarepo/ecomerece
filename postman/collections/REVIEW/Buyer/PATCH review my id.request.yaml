$kind: http-request
id: f0daa13dcc3db72462c384f2
name: PATCH /review/my/{{reviewId}}
description: buyer route
method: PATCH
url: '{{baseUrl}}/review/my/{{reviewId}}'
body:
  type: json
  content: |-
    {
      "rating": 1,
      "title": "Title example",
      "comment": "Comment example",
      "images": [
        "Image example"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /review/my/:id returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 5000
