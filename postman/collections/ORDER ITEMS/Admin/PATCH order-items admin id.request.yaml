$kind: http-request
id: 85f0471785dc34221eedd66f
name: PATCH /order-items/admin/{{orderItemId}}
description: admin route
method: PATCH
url: '{{baseUrl}}/order-items/admin/{{orderItemId}}'
body:
  type: json
  content: |-
    {
      "quantity": 1,
      "waitingTime": {},
      "price": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /order-items/admin/:id returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 12000
