$kind: http-request
id: 908fc15febeef203bb822e5c
name: GET /stats/admin/category/{{entityId}}/overview
description: admin route
method: GET
url: '{{baseUrl}}/stats/admin/category/{{entityId}}/overview'
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET /stats/admin/category/:entityId/overview returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 13000
