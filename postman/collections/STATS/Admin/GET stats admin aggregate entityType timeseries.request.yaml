$kind: http-request
id: 0b8812bafa4bac74167be210
name: GET /stats/admin/aggregate/product/timeseries
description: admin route
method: GET
url: '{{baseUrl}}/stats/admin/aggregate/product/timeseries'
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET /stats/admin/aggregate/:entityType/timeseries returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
