$kind: http-request
id: 9182889bb7c51da50ce98510
name: POST /stats/public/products/{{productId}}/click
description: public route
method: POST
url: '{{baseUrl}}/stats/public/products/{{productId}}/click'
scripts:
  - type: afterResponse
    code: |-
      pm.test('POST /stats/public/products/:productId/click returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 2000
