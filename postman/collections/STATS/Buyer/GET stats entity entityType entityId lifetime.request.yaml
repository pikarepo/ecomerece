$kind: http-request
id: 21c5f28fed6dc394a985c03b
name: GET /stats/entity/product/{{entityId}}/lifetime
description: buyer route
method: GET
url: '{{baseUrl}}/stats/entity/product/{{entityId}}/lifetime'
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET /stats/entity/:entityType/:entityId/lifetime returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 18000
