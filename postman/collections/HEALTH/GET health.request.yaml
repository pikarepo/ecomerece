$kind: http-request
name: GET /health
description: liveness route — unauthenticated, no database access
method: GET
url: '{{baseUrl}}/health'
scripts:
  - type: afterResponse
    code: |-
      pm.test('GET /health returns 200', () => {
        pm.response.to.have.status(200);
      });
      
      pm.test('body reports success', () => {
        const body = pm.response.json();
        pm.expect(body.success).to.be.true;
      });
    language: text/javascript
order: 1000
