$kind: http-request
id: 5c265172016a753465cb1790
name: PATCH /vendor/me/stats-refresh
description: owner route — toggle the automatic stats-refresh setting for the vendor
method: PATCH
url: '{{baseUrl}}/vendor/me/stats-refresh'
body:
  type: json
  content: |-
    {
      "enabled": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /vendor/me/stats-refresh returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 4000
