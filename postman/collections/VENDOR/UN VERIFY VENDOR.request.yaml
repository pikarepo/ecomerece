$kind: http-request
id: z3t82b1w4y9v7x035a6v81yz
name: PATCH /vendor/admin/reject
description: admin route — reject a vendor's KYC verification request
method: PATCH
url: '{{baseUrl}}/vendor/admin/reject'
body:
  type: json
  content: |-
    {
      "vendorId": "{{vendorId}}",
      "reason": "Submitted documents could not be verified."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PATCH /vendor/admin/reject returns a success status', () => {
        pm.expect(pm.response.code, pm.response.text().slice(0, 300)).to.be.oneOf([200, 201, 202, 204]);
      });
      
      pm.test('response is a JSON envelope', () => {
        if (pm.response.code === 204 || !pm.response.text()) { return; }
        const body = pm.response.json();
        pm.expect(body).to.be.an('object');
        if (Object.prototype.hasOwnProperty.call(body, 'success')) {
          pm.expect(body.success).to.be.true;
        }
      });
    language: text/javascript
order: 6000
